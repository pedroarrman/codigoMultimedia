<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reexportar imagen</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; }
    .box { border: 2px dashed #999; border-radius: 14px; padding: 32px; text-align: center; }
    canvas { max-width: 100%; margin-top: 20px; border-radius: 8px; }
    button, input { margin-top: 16px; }
    button { padding: 10px 16px; cursor: pointer; }
    #status { margin-top: 16px; color: #555; }
  </style>
</head>
<body>
  <h1>Reexportar imagen</h1>
  <p>
    Esta herramienta abre la imagen en el navegador y la vuelve a generar mediante
    <code>canvas</code>. El navegador no copia los bloques C2PA del archivo original
    al PNG/JPEG exportado.
  </p>

  <div class="box">
    <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
    <div id="status">Selecciona una imagen.</div>
    <canvas id="canvas" hidden></canvas>
    <br>
    <button id="download" disabled>Descargar imagen reexportada</button>
  </div>

<script>
const fileInput = document.getElementById('file');
const canvas = document.getElementById('canvas');
const download = document.getElementById('download');
const status = document.getElementById('status');

let originalName = 'imagen';
let loaded = false;

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  originalName = file.name.replace(/\.[^.]+$/, '');
  const url = URL.createObjectURL(file);

  try {
    const img = new Image();
    img.onload = () => {
      // Dibujamos únicamente los píxeles en un canvas nuevo.
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d', { alpha: true });
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0);

      canvas.hidden = false;
      loaded = true;
      download.disabled = false;
      status.textContent =
        `Imagen cargada: ${img.naturalWidth} × ${img.naturalHeight}px.`;
      URL.revokeObjectURL(url);
    };

    img.onerror = () => {
      status.textContent = 'No se pudo abrir la imagen.';
      URL.revokeObjectURL(url);
    };

    img.src = url;
  } catch (e) {
    status.textContent = 'Error al procesar la imagen.';
    URL.revokeObjectURL(url);
  }
});

download.addEventListener('click', () => {
  if (!loaded) return;

  canvas.toBlob(blob => {
    if (!blob) {
      status.textContent = 'No se pudo exportar la imagen.';
      return;
    }

    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = `${originalName}_reexportada.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);

    status.textContent =
      'Exportada como un PNG nuevo a partir de los píxeles de la imagen.';
  }, 'image/png');
});
</script>
</body>
</html>
